# ---------------------------------------------------- #
#                   EasyBan Messages                   #
#  Supports MiniMessage (e.g. <red>, <#FF5555>, <bold>)#
# ---------------------------------------------------- #
prefix: "<dark_gray>[<aqua>EasyBan</aqua>]</dark_gray> "
no-permission: "<red>You do not have permission to use this command!</red>"
player-only: "<red>This command can only be used by players.</red>"
invalid-usage: "<red>Usage: %usage%</red>"
player-not-found: "<red>Player not found or invalid IP.</red>"
invalid-duration: "<red>Invalid duration format! Example: 10m, 2h, 1d, 1w, 1d12h.</red>"
punishment-cancelled: "<red>This punishment was blocked by another plugin (API event cancelled).</red>"
punishment-not-found: "<yellow>No active punishment of that type found for <white>%target%</white> on <yellow>%server%</yellow> - nothing to remove.</yellow>"
reload-success: "<green>EasyBan configuration and language files have been reloaded!</green>"
discord-test-sent: "<green>Test message sent to the Discord webhook!</green>"
discord-test-not-configured: "<red>Discord webhook is disabled or no URL is set in the config!</red>"
discord-test-failed: "<red>Failed to reach the Discord webhook. Check the URL and your server's internet access.</red>"
banned-layout: "<red><bold>YOU ARE BANNED!</bold></red><newline><newline><gray>Reason:</gray> <white>%reason%</white><newline><gray>Banned by:</gray> <white>%admin%</white><newline><gray>Server:</gray> <white>%server%</white><newline><gray>Expires:</gray> <white>%time%</white>"
muted-message: "<red>You are muted on server <yellow>%server%</yellow>! Reason: %reason%</red>"
ipmuted-message: "<red>Your IP is muted on server <yellow>%server%</yellow>! Reason: %reason%</red>"
cant-break-message: "<red>You are restricted from breaking blocks on server <yellow>%server%</yellow>! Reason: %reason%</red>"
ban-success: "<green>Player/IP <white>%player%</white> has been banned on <yellow>%server%</yellow>.</green>"
unban-success: "<green>Player <white>%player%</white> has been unbanned.</green>"
kick-success: "<green>Player <white>%player%</white> has been kicked.</green>"
mute-success: "<green>Player/IP <white>%player%</white> has been muted on <yellow>%server%</yellow>.</green>"
unmute-success: "<green>Player <white>%player%</white> has been unmuted.</green>"
ipmute-success: "<green>IP <white>%ip%</white> has been muted on <yellow>%server%</yellow>.</green>"
unban-ip-success: "<green>IP <white>%ip%</white> has been unbanned.</green>"
unmute-ip-success: "<green>IP <white>%ip%</white> has been unmuted.</green>"
donotbreak-success: "<green>Player <white>%player%</white> has been blocked from breaking blocks on <yellow>%server%</yellow>.</green>"
deldonotbreak-success: "<green>Player <white>%player%</white> can now break blocks again.</green>"

# Status command output
status:
  header-player: "<gold>--- Punishment status of <white>%player%</white> ---</gold>"
  header-ip: "<gold>--- Punishment status of IP <white>%ip%</white> ---</gold>"
  no-punishments: "<green>  No active punishments found.</green>"
  permanent: "Permanent"
  expired: "Expired"
  kicked: "Kicked"
  type-ban: "BAN"
  type-ipban: "IP BAN"
  type-mute: "MUTE"
  type-ipmute: "IP MUTE"
  type-donotbreak: "NO BREAK"
  entry: "<gray>  <yellow>%type%</yellow> <dark_gray>|</dark_gray> Reason: <white>%reason%</white> <dark_gray>|</dark_gray> By: <white>%admin%</white> <dark_gray>|</dark_gray> Expires: <white>%expiry%</white> <dark_gray>|</dark_gray> Server: <white>%server%</white>%extra%</gray>"
  exempt-label: " <dark_gray>|</dark_gray> Exempt: <white>%exempt%</white>"

# Texts used inside the Discord webhook embeds (only used when Discord is enabled).
discord:
  ban-title: ":hammer: Player Banned"
  mute-title: ":no_mouth: Player Muted"
  kick-title: ":boot: Player Kicked"
  unpunish-title: ":unlock: Punishment Removed"
  blockbreak-title: ":pick: Block Breaking Restricted"
  test-title: ":white_check_mark: Test Message"
  test-description: "If you can see this, the EasyBan webhook is configured correctly!"
  field-target: "Target"
  field-mode: "Mode"
  field-admin: "Moderator"
  field-reason: "Reason"
  field-duration: "Duration"
  field-server: "Server"
  field-exempt: "Exempted Players"
  value-permanent: "Permanent"
  mode-player: "Player"
  mode-ip: "IP Address"
  footer: "EasyBan • Server: %server%"