# ---------------------------------------------------- #
#                  Mensajes de EasyBan                 #
#  Soporta MiniMessage (ej. <red>, <#FF5555>, <bold>)  #
# ---------------------------------------------------- #
prefix: "<dark_gray>[<aqua>EasyBan</aqua>]</dark_gray> "
no-permission: "<red>¡No tienes permiso para usar este comando!</red>"
player-only: "<red>Este comando solo puede ser usado por jugadores.</red>"
invalid-usage: "<red>Uso: %usage%</red>"
player-not-found: "<red>Jugador no encontrado o IP inválida.</red>"
invalid-duration: "<red>¡Formato de duración inválido! Ejemplo: 10m, 2h, 1d, 1w, 1d12h.</red>"
punishment-cancelled: "<red>Este castigo fue bloqueado por otro plugin (evento de la API cancelado).</red>"
punishment-not-found: "<yellow>No se encontró ningún castigo activo de ese tipo para <white>%target%</white> en <yellow>%server%</yellow> - nada que eliminar.</yellow>"
reload-success: "<green>¡La configuración y los archivos de idioma de EasyBan han sido recargados!</green>"
discord-test-sent: "<green>¡Mensaje de prueba enviado al webhook de Discord!</green>"
discord-test-not-configured: "<red>¡El webhook de Discord está desactivado o no hay URL en la configuración!</red>"
discord-test-failed: "<red>No se pudo contactar con el webhook de Discord. Revisa la URL y la conexión a internet del servidor.</red>"
banned-layout: "<red><bold>¡HAS SIDO BANEADO!</bold></red><newline><newline><gray>Razón:</gray> <white>%reason%</white><newline><gray>Baneado por:</gray> <white>%admin%</white><newline><gray>Servidor:</gray> <white>%server%</white><newline><gray>Expira:</gray> <white>%time%</white>"
muted-message: "<red>Has sido silenciado en el servidor <yellow>%server%</yellow>! Razón: %reason%</red>"
ipmuted-message: "<red>Tu IP ha sido silenciada en el servidor <yellow>%server%</yellow>! Razón: %reason%</red>"
cant-break-message: "<red>Tienes restringido romper bloques en el servidor <yellow>%server%</yellow>! Razón: %reason%</red>"
ban-success: "<green>El jugador/IP <white>%player%</white> ha sido baneado en <yellow>%server%</yellow>.</green>"
unban-success: "<green>El jugador <white>%player%</white> ha sido desbaneado.</green>"
kick-success: "<green>El jugador <white>%player%</white> ha sido expulsado.</green>"
mute-success: "<green>El jugador/IP <white>%player%</white> ha sido silenciado en <yellow>%server%</yellow>.</green>"
unmute-success: "<green>El jugador <white>%player%</white> ya no está silenciado.</green>"
ipmute-success: "<green>La IP <white>%ip%</white> ha sido silenciada en <yellow>%server%</yellow>.</green>"
unban-ip-success: "<green>La IP <white>%ip%</white> ha sido desbaneada.</green>"
unmute-ip-success: "<green>La IP <white>%ip%</white> ya no está silenciada.</green>"
donotbreak-success: "<green>Al jugador <white>%player%</white> se le ha bloqueado romper bloques en <yellow>%server%</yellow>.</green>"
deldonotbreak-success: "<green>El jugador <white>%player%</white> ya puede romper bloques de nuevo.</green>"

# Salida del comando status
status:
  header-player: "<gold>--- Estado de castigos de <white>%player%</white> ---</gold>"
  header-ip: "<gold>--- Estado de castigos de la IP <white>%ip%</white> ---</gold>"
  no-punishments: "<green>  No se encontraron castigos activos.</green>"
  permanent: "Permanente"
  expired: "Expirado"
  kicked: "Expulsado"
  type-ban: "BAN"
  type-ipban: "IP BAN"
  type-mute: "MUTE"
  type-ipmute: "IP MUTE"
  type-donotbreak: "NO BREAK"
  entry: "<gray>  <yellow>%type%</yellow> <dark_gray>|</dark_gray> Razón: <white>%reason%</white> <dark_gray>|</dark_gray> Por: <white>%admin%</white> <dark_gray>|</dark_gray> Expira: <white>%expiry%</white> <dark_gray>|</dark_gray> Servidor: <white>%server%</white>%extra%</gray>"
  exempt-label: " <dark_gray>|</dark_gray> Exentos: <white>%exempt%</white>"

# Textos usados en los embeds del webhook de Discord.
discord:
  ban-title: ":hammer: Jugador baneado"
  mute-title: ":no_mouth: Jugador silenciado"
  kick-title: ":boot: Jugador expulsado"
  unpunish-title: ":unlock: Castigo eliminado"
  blockbreak-title: ":pick: Rotura de bloques restringida"
  test-title: ":white_check_mark: Mensaje de prueba"
  test-description: "¡Si ves esto, el webhook de EasyBan está configurado correctamente!"
  field-target: "Objetivo"
  field-mode: "Modo"
  field-admin: "Moderador"
  field-reason: "Razón"
  field-duration: "Duración"
  field-server: "Servidor"
  field-exempt: "Jugadores exentos"
  value-permanent: "Permanente"
  mode-player: "Jugador"
  mode-ip: "Dirección IP"
  footer: "EasyBan • Servidor: %server%"