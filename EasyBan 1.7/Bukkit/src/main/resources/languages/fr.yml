# ---------------------------------------------------- #
#                   Messages EasyBan                   #
#  Prend en charge MiniMessage (ex. <red>, <#FF5555>)  #
# ---------------------------------------------------- #
prefix: "<dark_gray>[<aqua>EasyBan</aqua>]</dark_gray> "
no-permission: "<red>Vous n'avez pas la permission d'utiliser cette commande !</red>"
player-only: "<red>Cette commande ne peut être utilisée que par des joueurs.</red>"
invalid-usage: "<red>Utilisation : %usage%</red>"
player-not-found: "<red>Joueur introuvable ou IP invalide.</red>"
invalid-duration: "<red>Format de durée invalide ! Exemple : 10m, 2h, 1d, 1w, 1d12h.</red>"
punishment-cancelled: "<red>Cette sanction a été bloquée par un autre plugin (événement API annulé).</red>"
punishment-not-found: "<yellow>Aucune sanction active de ce type n'a été trouvée pour <white>%target%</white> sur <yellow>%server%</yellow> - rien à supprimer.</yellow>"
reload-success: "<green>La configuration et les fichiers de langue d'EasyBan ont été rechargés !</green>"
discord-test-sent: "<green>Message de test envoyé au webhook Discord !</green>"
discord-test-not-configured: "<red>Le webhook Discord est désactivé ou aucune URL n'est définie dans la config !</red>"
discord-test-failed: "<red>Impossible de joindre le webhook Discord. Vérifiez l'URL et la connexion internet du serveur.</red>"
banned-layout: "<red><bold>VOUS ÊTES BANNI !</bold></red><newline><newline><gray>Raison :</gray> <white>%reason%</white><newline><gray>Banni par :</gray> <white>%admin%</white><newline><gray>Serveur :</gray> <white>%server%</white><newline><gray>Expire :</gray> <white>%time%</white>"
muted-message: "<red>Vous êtes réduit au silence sur le serveur <yellow>%server%</yellow> ! Raison : %reason%</red>"
ipmuted-message: "<red>Votre IP est réduite au silence sur le serveur <yellow>%server%</yellow> ! Raison : %reason%</red>"
cant-break-message: "<red>Vous n'êtes pas autorisé à casser de blocs sur le serveur <yellow>%server%</yellow> ! Raison : %reason%</red>"
ban-success: "<green>Le joueur/l'IP <white>%player%</white> a été banni sur <yellow>%server%</yellow>.</green>"
unban-success: "<green>Le joueur <white>%player%</white> a été débanni.</green>"
kick-success: "<green>Le joueur <white>%player%</white> a été expulsé.</green>"
mute-success: "<green>Le joueur/l'IP <white>%player%</white> a été réduit au silence sur <yellow>%server%</yellow>.</green>"
unmute-success: "<green>Le joueur <white>%player%</white> n'est plus réduit au silence.</green>"
ipmute-success: "<green>L'IP <white>%ip%</white> a été réduite au silence sur <yellow>%server%</yellow>.</green>"
unban-ip-success: "<green>L'IP <white>%ip%</white> a été débannie.</green>"
unmute-ip-success: "<green>L'IP <white>%ip%</white> n'est plus réduite au silence.</green>"
donotbreak-success: "<green>Le joueur <white>%player%</white> ne peut plus casser de blocs sur <yellow>%server%</yellow>.</green>"
deldonotbreak-success: "<green>Le joueur <white>%player%</white> peut à nouveau casser des blocs.</green>"

# Sortie de la commande status
status:
  header-player: "<gold>--- Statut des sanctions de <white>%player%</white> ---</gold>"
  header-ip: "<gold>--- Statut des sanctions de l'IP <white>%ip%</white> ---</gold>"
  no-punishments: "<green>  Aucune sanction active trouvée.</green>"
  permanent: "Permanent"
  expired: "Expiré"
  kicked: "Expulsé"
  type-ban: "BAN"
  type-ipban: "IP BAN"
  type-mute: "MUTE"
  type-ipmute: "IP MUTE"
  type-donotbreak: "NO BREAK"
  entry: "<gray>  <yellow>%type%</yellow> <dark_gray>|</dark_gray> Raison : <white>%reason%</white> <dark_gray>|</dark_gray> Par : <white>%admin%</white> <dark_gray>|</dark_gray> Expire : <white>%expiry%</white> <dark_gray>|</dark_gray> Serveur : <white>%server%</white>%extra%</gray>"
  exempt-label: " <dark_gray>|</dark_gray> Exemptés : <white>%exempt%</white>"

# Textes utilisés dans les embeds du webhook Discord.
discord:
  ban-title: ":hammer: Joueur banni"
  mute-title: ":no_mouth: Joueur réduit au silence"
  kick-title: ":boot: Joueur expulsé"
  unpunish-title: ":unlock: Sanction supprimée"
  blockbreak-title: ":pick: Casse de blocs restreinte"
  test-title: ":white_check_mark: Message de test"
  test-description: "Si vous voyez ceci, le webhook EasyBan est correctement configuré !"
  field-target: "Cible"
  field-mode: "Mode"
  field-admin: "Modérateur"
  field-reason: "Raison"
  field-duration: "Durée"
  field-server: "Serveur"
  field-exempt: "Joueurs exemptés"
  value-permanent: "Permanent"
  mode-player: "Joueur"
  mode-ip: "Adresse IP"
  footer: "EasyBan • Serveur : %server%"