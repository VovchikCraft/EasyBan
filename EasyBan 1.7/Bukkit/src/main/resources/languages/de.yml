# ---------------------------------------------------- #
#                 EasyBan Nachrichten                  #
#  Unterstützt MiniMessage (z.B. <red>, <#FF5555>)     #
# ---------------------------------------------------- #
prefix: "<dark_gray>[<aqua>EasyBan</aqua>]</dark_gray> "
no-permission: "<red>Du hast keine Berechtigung, diesen Befehl zu verwenden!</red>"
player-only: "<red>Dieser Befehl kann nur von Spielern verwendet werden.</red>"
invalid-usage: "<red>Verwendung: %usage%</red>"
player-not-found: "<red>Spieler nicht gefunden oder ungültige IP.</red>"
invalid-duration: "<red>Ungültiges Zeitformat! Beispiel: 10m, 2h, 1d, 1w, 1d12h.</red>"
punishment-cancelled: "<red>Diese Bestrafung wurde von einem anderen Plugin blockiert (API-Event abgebrochen).</red>"
punishment-not-found: "<yellow>Für <white>%target%</white> wurde auf <yellow>%server%</yellow> keine aktive Bestrafung dieses Typs gefunden - nichts zu entfernen.</yellow>"
reload-success: "<green>EasyBan-Konfiguration und Sprachdateien wurden neu geladen!</green>"
discord-test-sent: "<green>Testnachricht an den Discord-Webhook gesendet!</green>"
discord-test-not-configured: "<red>Discord-Webhook ist deaktiviert oder keine URL in der Config gesetzt!</red>"
discord-test-failed: "<red>Der Discord-Webhook konnte nicht erreicht werden. Prüfe die URL und die Internetverbindung des Servers.</red>"
banned-layout: "<red><bold>DU WURDEST GEBANNT!</bold></red><newline><newline><gray>Grund:</gray> <white>%reason%</white><newline><gray>Gebannt von:</gray> <white>%admin%</white><newline><gray>Server:</gray> <white>%server%</white><newline><gray>Läuft ab:</gray> <white>%time%</white>"
muted-message: "<red>Du bist auf dem Server <yellow>%server%</yellow> stummgeschaltet! Grund: %reason%</red>"
ipmuted-message: "<red>Deine IP ist auf dem Server <yellow>%server%</yellow> stummgeschaltet! Grund: %reason%</red>"
cant-break-message: "<red>Du darfst auf dem Server <yellow>%server%</yellow> keine Blöcke abbauen! Grund: %reason%</red>"
ban-success: "<green>Spieler/IP <white>%player%</white> wurde auf <yellow>%server%</yellow> gebannt.</green>"
unban-success: "<green>Spieler <white>%player%</white> wurde entbannt.</green>"
kick-success: "<green>Spieler <white>%player%</white> wurde gekickt.</green>"
mute-success: "<green>Spieler/IP <white>%player%</white> wurde auf <yellow>%server%</yellow> stummgeschaltet.</green>"
unmute-success: "<green>Spieler <white>%player%</white> wurde entmutet.</green>"
ipmute-success: "<green>IP <white>%ip%</white> wurde auf <yellow>%server%</yellow> stummgeschaltet.</green>"
unban-ip-success: "<green>IP <white>%ip%</white> wurde entbannt.</green>"
unmute-ip-success: "<green>IP <white>%ip%</white> wurde entmutet.</green>"
donotbreak-success: "<green>Spieler <white>%player%</white> kann auf <yellow>%server%</yellow> keine Blöcke mehr abbauen.</green>"
deldonotbreak-success: "<green>Spieler <white>%player%</white> kann wieder Blöcke abbauen.</green>"

# Status-Befehl Ausgabe
status:
  header-player: "<gold>--- Bestrafungsstatus von <white>%player%</white> ---</gold>"
  header-ip: "<gold>--- Bestrafungsstatus der IP <white>%ip%</white> ---</gold>"
  no-punishments: "<green>  Keine aktiven Bestrafungen gefunden.</green>"
  permanent: "Permanent"
  expired: "Abgelaufen"
  kicked: "Gekickt"
  type-ban: "BAN"
  type-ipban: "IP BAN"
  type-mute: "MUTE"
  type-ipmute: "IP MUTE"
  type-donotbreak: "NO BREAK"
  entry: "<gray>  <yellow>%type%</yellow> <dark_gray>|</dark_gray> Grund: <white>%reason%</white> <dark_gray>|</dark_gray> Von: <white>%admin%</white> <dark_gray>|</dark_gray> Läuft ab: <white>%expiry%</white> <dark_gray>|</dark_gray> Server: <white>%server%</white>%extra%</gray>"
  exempt-label: " <dark_gray>|</dark_gray> Ausgenommen: <white>%exempt%</white>"

# Texte für die Discord-Webhook-Embeds.
discord:
  ban-title: ":hammer: Spieler gebannt"
  mute-title: ":no_mouth: Spieler stummgeschaltet"
  kick-title: ":boot: Spieler gekickt"
  unpunish-title: ":unlock: Bestrafung aufgehoben"
  blockbreak-title: ":pick: Blockabbau eingeschränkt"
  test-title: ":white_check_mark: Testnachricht"
  test-description: "Wenn du das siehst, ist der EasyBan-Webhook richtig konfiguriert!"
  field-target: "Ziel"
  field-mode: "Modus"
  field-admin: "Moderator"
  field-reason: "Grund"
  field-duration: "Dauer"
  field-server: "Server"
  field-exempt: "Ausgenommene Spieler"
  value-permanent: "Permanent"
  mode-player: "Spieler"
  mode-ip: "IP-Adresse"
  footer: "EasyBan • Server: %server%"