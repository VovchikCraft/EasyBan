unban-success: "<green>Гравця <white>%player%</white> розбанено.</green>"
kick-success: "<green>Гравця <white>%player%</white> вигнано з сервера.</green>"
mute-success: "<green>Гравця/IP <white>%player%</white> замовчено на <yellow>%server%</yellow>.</green>"
unmute-success: "<green>Гравця <white>%player%</white> розмовчено.</green>"
ipmute-success: "<green>IP <white>%ip%</white> замовчено на <yellow>%server%</yellow>.</green>"
unban-ip-success: "<green>IP <white>%ip%</white> розбанено.</green>"
unmute-ip-success: "<green>IP <white>%ip%</white> розмовчено.</green>"
donotbreak-success: "<green>Гравцю <white>%player%</white> заборонено ламати блоки на <yellow>%server%</yellow>.</green>"
deldonotbreak-success: "<green>Гравець <white>%player%</white> знову може ламати блоки.</green>"

# Вивід команди status
status:
  header-player: "<gold>--- Статус покарань <white>%player%</white> ---</gold>"
  header-ip: "<gold>--- Статус покарань IP <white>%ip%</white> ---</gold>"
  no-punishments: "<green>  Активних покарань не знайдено.</green>"
  permanent: "Назавжди"
  expired: "Закінчився"
  kicked: "Вигнано"
  type-ban: "БАН"
  type-ipban: "IP БАН"
  type-mute: "МУТ"
  type-ipmute: "IP МУТ"
  type-donotbreak: "БЕЗ ЛАМАННЯ"
  entry: "<gray>  <yellow>%type%</yellow> <dark_gray>|</dark_gray> Причина: <white>%reason%</white> <dark_gray>|</dark_gray> Від: <white>%admin%</white> <dark_gray>|</dark_gray> Закінчується: <white>%expiry%</white> <dark_gray>|</dark_gray> Сервер: <white>%server%</white>%extra%</gray>"
  exempt-label: " <dark_gray>|</dark_gray> Винятки: <white>%exempt%</white>"

