# ---------------------------------------------------- #
#                 EasyBan-lite Messages                #
#  Supports MiniMessage (e.g. <red>, <#FF5555>, <bold>)#
# ---------------------------------------------------- #

prefix: "<dark_gray>[<aqua>EasyBan</aqua>]</dark_gray> "
no-permission: "<red>You do not have permission to use this command!</red>"
player-only: "<red>This command can only be used by players.</red>"
invalid-usage: "<red>Usage: %usage%</red>"
player-not-found: "<red>Player not found or invalid IP.</red>"
invalid-duration: "<red>Invalid duration format! Example: 10m, 2h, 1d, 1w.</red>"

banned-layout: "<red><bold>YOU ARE BANNED!</bold></red><newline><newline><gray>Reason:</gray> <white>%reason%</white><newline><gray>Banned by:</gray> <white>%admin%</white><newline><gray>Expires:</gray> <white>%time%</white>"
muted-message: "<red>You are muted! Reason: %reason%</red>"
ipmuted-message: "<red>Your IP is muted! Reason: %reason%</red>"

ban-success: "<green>Player/IP <white>%player%</white> has been banned.</green>"
unban-success: "<green>Player <white>%player%</white> has been unbanned.</green>"
kick-success: "<green>Player <white>%player%</white> has been kicked.</green>"
mute-success: "<green>Player/IP <white>%player%</white> has been muted.</green>"
unmute-success: "<green>Player <white>%player%</white> has been unmuted.</green>"
ipmute-success: "<green>IP <white>%ip%</white> has been muted.</green>"
unban-ip-success: "<green>IP <white>%ip%</white> has been unbanned.</green>"
unmute-ip-success: "<green>IP <white>%ip%</white> has been unmuted.</green>"